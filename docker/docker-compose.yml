# This file permits to launch docker images of services required for this app
#
services:
  # launch it with ' docker compose up -d redis'
  redis:
    image: redis:latest
    ports:
      - 6378:6379

  # launch it with ' docker compose up -d pubsub'
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    ports:
      - 8085:8085
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=fly-xc

  # launch it with ' docker compose up -d datastore'
  datastore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators datastore start --host-port=0.0.0.0:8081 --project=fly-xc
    ports:
      - 8081:8081
